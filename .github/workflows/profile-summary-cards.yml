name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pink GitHub Profile Summary Cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 650710539yanisa
          BRANCH_NAME: "main"
          UTC_OFFSET: 7
          AUTO_PUSH: false
          THEME: "default"

      - name: Apply Pink Minimal Theme
        run: |
          python3 <<'PY'
          import re
          import colorsys
          from pathlib import Path

          ROOT = Path("profile-summary-card-output/default")

          def pinkify(match):
              value = match.group(1)

              if len(value) == 3:
                  value = ''.join(c * 2 for c in value)

              if len(value) != 6:
                  return match.group(0)

              r = int(value[0:2], 16) / 255
              g = int(value[2:4], 16) / 255
              b = int(value[4:6], 16) / 255

              h, s, l = colorsys.rgb_to_hls(r, g, b)

              # Keep white / near-white backgrounds white
              if l > 0.92:
                  new = "FFFFFF"

              # Keep very light gray backgrounds/borders subtle
              elif l > 0.82 and s < 0.15:
                  new = "FCE7F3"

              # Gray text
              elif s < 0.15:
                  new = "6B7280"

              # Very dark colors -> dark pink
              elif l < 0.30:
                  new = "BE185D"

              # Medium colors -> main pink
              elif l < 0.60:
                  new = "EC4899"

              # Light colors -> soft pink
              else:
                  new = "F9A8D4"

              return "#" + new

          pattern = re.compile(r"#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})(?![0-9a-fA-F])")

          for file in ROOT.glob("*.svg"):
              text = file.read_text(encoding="utf-8")
              text = pattern.sub(pinkify, text)
              file.write_text(text, encoding="utf-8")

          print("Pink theme applied successfully.")
          PY

      - name: Move Pink Cards
        run: |
          rm -rf profile-summary-card-output/pink
          mv profile-summary-card-output/default profile-summary-card-output/pink

      - name: Commit Pink Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update pink profile summary cards"
            git push
          fi
