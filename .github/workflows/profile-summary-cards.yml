name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pink GitHub Profile Summary Cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 650710539yanisa
          BRANCH_NAME: "main"
          UTC_OFFSET: 7
          AUTO_PUSH: false
          THEME: "default"

      - name: Apply Real Pink Theme
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("profile-summary-card-output/default")
          
          # เฉดสีชมพูสำหรับชาร์ตวงกลม (เรียงตามลำดับความนิยม)
          pink_donut_palette = [
              "#db2777",  # Pink เข้ม (อันดับ 1)
              "#f43f5e",  # Rose
              "#ec4899",  # Hot Pink
              "#f472b6",  # Light Rose
              "#c026d3",  # Fuchsia/Berry
              "#fb7185",  # Soft Pink
              "#9d174d",  # Deep Wine Pink
              "#fda4af",  # Pastel Rose
          ]

          for svg in root.glob("*.svg"):
              text = svg.read_text(encoding="utf-8")

              # 1. เปลี่ยนเส้นขอบการ์ดให้เป็นสีชมพูอ่อน
              text = re.sub(r'stroke="#e4e2e2"', 'stroke="#fbcfe8"', text, flags=re.IGNORECASE)
              text = re.sub(r'stroke="#e1e4e8"', 'stroke="#fbcfe8"', text, flags=re.IGNORECASE)

              # 2. เปลี่ยนหัวข้อการ์ด (Top Languages, Stats) ให้เป็นสี Hot Pink
              text = re.sub(r'fill="#2f363d"', 'fill="#db2777"', text, flags=re.IGNORECASE)
              text = re.sub(r'fill="#24292e"', 'fill="#db2777"', text, flags=re.IGNORECASE)

              # 3. เปลี่ยนสีไอคอนแมว GitHub (Octocat) ให้เป็นสีชมพู
              text = re.sub(r'fill="#586069"', 'fill="#f472b6"', text, flags=re.IGNORECASE)
              text = re.sub(r'stroke="#586069"', 'stroke="#ec4899"', text, flags=re.IGNORECASE)

              # 4. เปลี่ยนสีกราฟ Contribution (เส้นกราฟและพื้นที่ใต้กราฟ)
              text = re.sub(r'fill="#9be9a8"', 'fill="#fbcfe8"', text, flags=re.IGNORECASE)
              text = re.sub(r'fill="#40c463"', 'fill="#f472b6"', text, flags=re.IGNORECASE)
              text = re.sub(r'fill="#30a14e"', 'fill="#ec4899"', text, flags=re.IGNORECASE)
              text = re.sub(r'fill="#216e39"', 'fill="#be185d"', text, flags=re.IGNORECASE)

              # 5. กวาดจับสีของภาษาดั้งเดิมทั้งหมดใน Donut Chart & Legend แล้วแทนด้วยเฉดชมพู
              found_colors = set(re.findall(r'fill="(#[0-9a-fA-F]{6})"', text))
              # ยกเว้นสีขาวและสีที่เราเซ็ตไว้แล้ว
              excluded = {"#ffffff", "#ffffff", "#db2777", "#f472b6", "#ec4899", "#fbcfe8", "#be185d"}
              donut_colors = [c for c in found_colors if c.lower() not in excluded]

              for idx, color in enumerate(donut_colors):
                  replacement_pink = pink_donut_palette[idx % len(pink_donut_palette)]
                  text = re.sub(f'fill="{color}"', f'fill="{replacement_pink}"', text, flags=re.IGNORECASE)
                  text = re.sub(f'stroke="{color}"', f'stroke="{replacement_pink}"', text, flags=re.IGNORECASE)

              # บันทึกไฟล์กลับ
              svg.write_text(text, encoding="utf-8")

          print("Pink aesthetic successfully applied to all elements!")

      - name: Move cards to pink folder
        run: |
          rm -rf profile-summary-card-output/pink
          mv profile-summary-card-output/default profile-summary-card-output/pink

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: apply proper pink theme to summary cards"
            git push
          fi
