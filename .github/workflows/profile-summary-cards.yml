
name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pink GitHub Profile Summary Cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 650710539yanisa
          BRANCH_NAME: "main"
          UTC_OFFSET: 7
          AUTO_PUSH: false
          THEME: "default"

      - name: Apply Real Pink Theme
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("profile-summary-card-output/default")

          pink_donut_palette = [
              "#db2777",
              "#f43f5e",
              "#ec4899",
              "#f472b6",
              "#c026d3",
              "#fb7185",
              "#9d174d",
              "#fda4af",
          ]

          pink_chart_palette = [
              "#fce7f3",
              "#fbcfe8",
              "#f9a8d4",
              "#f472b6",
              "#ec4899",
              "#db2777",
              "#be185d",
          ]

          color_map = {
              # Border
              "#e4e2e2": "#fbcfe8",
              "#e1e4e8": "#fbcfe8",

              # Text
              "#2f363d": "#db2777",
              "#24292e": "#db2777",

              # GitHub icon
              "#586069": "#f472b6",

              # Contribution graph
              "#9be9a8": "#fce7f3",
              "#40c463": "#f9a8d4",
              "#30a14e": "#ec4899",
              "#216e39": "#be185d",

              # Other graph colors
              "#79c0ff": "#f9a8d4",
              "#58a6ff": "#f472b6",
              "#1f6feb": "#db2777",
              "#0969da": "#ec4899",

              "#a371f7": "#d946ef",
              "#bc8cff": "#f0abfc",
              "#8250df": "#c026d3",

              "#56d364": "#f472b6",
              "#3fb950": "#ec4899",
              "#2ea44f": "#db2777",
              "#238636": "#be185d",

              "#00b4d8": "#f472b6",

              "#8b949e": "#f9a8d4",
              "#6e7681": "#f472b6",
          }

          for svg in root.glob("*.svg"):
              text = svg.read_text(encoding="utf-8")

              # Replace known colors
              for old_color, new_color in color_map.items():
                  text = re.sub(
                      rf'fill="{re.escape(old_color)}"',
                      f'fill="{new_color}"',
                      text,
                      flags=re.IGNORECASE,
                  )

                  text = re.sub(
                      rf'stroke="{re.escape(old_color)}"',
                      f'stroke="{new_color}"',
                      text,
                      flags=re.IGNORECASE,
                  )

              # Replace colors inside style attributes as well
              for old_color, new_color in color_map.items():
                  text = text.replace(
                      old_color.lower(),
                      new_color
                  )
                  text = text.replace(
                      old_color.upper(),
                      new_color
                  )

              # Find remaining colors used by charts/donuts
              found_colors = set(
                  re.findall(
                      r'(?:fill|stroke)="(#[0-9a-fA-F]{6})"',
                      text
                  )
              )

              excluded_colors = {
                  "#ffffff",
                  "#fce7f3",
                  "#fbcfe8",
                  "#f9a8d4",
                  "#f472b6",
                  "#ec4899",
                  "#db2777",
                  "#be185d",
                  "#f43f5e",
                  "#c026d3",
                  "#fb7185",
                  "#9d174d",
                  "#fda4af",
              }

              remaining_colors = [
                  color
                  for color in found_colors
                  if color.lower() not in excluded_colors
              ]

              for index, old_color in enumerate(remaining_colors):
                  new_color = pink_donut_palette[
                      index % len(pink_donut_palette)
                  ]

                  text = re.sub(
                      rf'fill="{re.escape(old_color)}"',
                      f'fill="{new_color}"',
                      text,
                      flags=re.IGNORECASE,
                  )

                  text = re.sub(
                      rf'stroke="{re.escape(old_color)}"',
                      f'stroke="{new_color}"',
                      text,
                      flags=re.IGNORECASE,
                  )

              svg.write_text(
                  text,
                  encoding="utf-8"
              )

              print(f"Pink theme applied: {svg.name}")

          print("Pink theme successfully applied to all SVG cards!")


      - name: Move cards to pink folder
        run: |
          rm -rf profile-summary-card-output/pink
          mv profile-summary-card-output/default profile-summary-card-output/pink

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: apply pink theme to summary cards"
            git push
          fi

