name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pink GitHub Profile Summary Cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 650710539yanisa
          BRANCH_NAME: "main"
          UTC_OFFSET: 7
          AUTO_PUSH: false
          THEME: "default"

      - name: Apply Pink High-Contrast Theme
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("profile-summary-card-output/default")

          # Color mapping: Default colors -> High Contrast Pink & Readable Text Palette
          colors = {
              # --- Titles, Main Text & Numbers (เน้นให้อ่านชัดเจน ไม่จม) ---
              "#607d8b": "#db2777",  # Header / Titles (Rose Pink 600)
              "#455a64": "#9d174d",  # Sub-titles / Important labels (Deep Pink 800)
              "#37474f": "#1f2937",  # Body text / Numbers (Dark Slate - อ่านง่าย คมชัด)

              # --- Chart Slices & Languages (เฉดชมพูเข้ม-บานเย็น ไม่ใช้สีพาสเทลอ่อนเกินไป) ---
              "#f44336": "#f43f5e",  # Rose
              "#e91e63": "#ec4899",  # Pink
              "#9c27b0": "#d946ef",  # Fuchsia
              "#673ab7": "#c026d3",  # Deep Fuchsia
              "#3f51b5": "#be185d",  # Dark Pink
              "#2196f3": "#fb7185",  # Soft Rose
              "#03a9f4": "#e11d48",  # Ruby
              "#00bcd4": "#831843",  # Wine Pink

              "#4caf50": "#f472b6",  # Light Pink Accent
              "#8bc34a": "#db2777",  # Pink 600
              "#cddc39": "#ec4899",  # Pink 500

              "#ffeb3b": "#fda4af",  # Rose Accent
              "#ffc107": "#f43f5e",  # Rose 500
              "#ff9800": "#be185d",  # Pink 700
              "#ff5722": "#9d174d",  # Pink 800

              "#795548": "#831843",  # Deep Wine
              "#9e9e9e": "#4b5563",  # Muted Dark Gray for subtext
          }

          for svg in root.glob("*.svg"):
              text = svg.read_text(encoding="utf-8")

              # Replace theme colors
              for old, new in colors.items():
                  text = re.sub(
                      old,
                      new,
                      text,
                      flags=re.IGNORECASE
                  )

              # Keep all card backgrounds crisp white
              text = re.sub(
                  r'fill=["\']#(?:fff|ffffff)["\']',
                  'fill="#FFFFFF"',
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r'(fill:\s*)#(?:fff|ffffff)',
                  r'\1#FFFFFF',
                  text,
                  flags=re.IGNORECASE
              )

              svg.write_text(text, encoding="utf-8")

          print("Pink High-Contrast theme applied successfully.")

      - name: Move cards to pink folder
        run: |
          rm -rf profile-summary-card-output/pink
          mv profile-summary-card-output/default profile-summary-card-output/pink

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update pink high-contrast profile summary cards"
            git push
          fi
