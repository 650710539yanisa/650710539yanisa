name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Pink GitHub Profile Summary Cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 650710539yanisa
          BRANCH_NAME: "main"
          UTC_OFFSET: 7
          AUTO_PUSH: false
          THEME: "default"

      - name: Apply Pink Minimal Theme
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("profile-summary-card-output/default")

          # Original default-theme colors -> pink palette
          colors = {
              "#607d8b": "#ec4899",
              "#455a64": "#be185d",
              "#37474f": "#6b7280",

              "#f44336": "#f9a8d4",
              "#e91e63": "#ec4899",
              "#9c27b0": "#f472b6",
              "#673ab7": "#f9a8d4",
              "#3f51b5": "#ec4899",
              "#2196f3": "#f472b6",
              "#03a9f4": "#f9a8d4",
              "#00bcd4": "#fbcfe8",

              "#4caf50": "#f472b6",
              "#8bc34a": "#f9a8d4",
              "#cddc39": "#fbcfe8",

              "#ffeb3b": "#fbcfe8",
              "#ffc107": "#f9a8d4",
              "#ff9800": "#f472b6",
              "#ff5722": "#ec4899",

              "#795548": "#be185d",
              "#9e9e9e": "#9ca3af",
          }

          for svg in root.glob("*.svg"):
              text = svg.read_text(encoding="utf-8")

              # Replace only known theme colors.
              for old, new in colors.items():
                  text = re.sub(
                      old,
                      new,
                      text,
                      flags=re.IGNORECASE
                  )

              # Keep all white backgrounds white.
              text = re.sub(
                  r'fill=["\']#(?:fff|ffffff)["\']',
                  'fill="#FFFFFF"',
                  text,
                  flags=re.IGNORECASE
              )

              # Keep card backgrounds white.
              text = re.sub(
                  r'(fill:\s*)#(?:fff|ffffff)',
                  r'\1#FFFFFF',
                  text,
                  flags=re.IGNORECASE
              )

              svg.write_text(text, encoding="utf-8")

          print("Pink Minimal theme applied.")

      - name: Move cards to pink folder
        run: |
          rm -rf profile-summary-card-output/pink
          mv profile-summary-card-output/default profile-summary-card-output/pink

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update pink profile summary cards"
            git push
          fi
